[package]
name = "dbreader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dbreader"
path = "dbreader.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
